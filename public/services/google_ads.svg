      <g transform="translate(0, 2)">
        <path d="M12 6.5C12 6.06 11.96 5.64 11.89 5.23H6V7.63H9.37C9.22 8.42 8.78 9.09 8.11 9.54V11.13H10.15C11.35 10.03 12 8.42 12 6.5Z" fill="#4285F4"/>
        <path d="M6 12.6C7.73 12.6 9.17 12.03 10.15 11.13L8.11 9.54C7.55 9.92 6.84 10.15 6 10.15C4.33 10.15 2.92 9.02 2.42 7.51H0.32V9.14C1.35 11.19 3.51 12.6 6 12.6Z" fill="#34A853"/>
        <path d="M2.42 7.51C2.29 7.13 2.22 6.72 2.22 6.3C2.22 5.88 2.29 5.47 2.42 5.09V3.46H0.32C-0.12 4.33 -0.37 5.29 -0.37 6.3C-0.37 7.31 -0.12 8.27 0.32 9.14L2.42 7.51Z" fill="#FBBC05"/>
        <path d="M6 2.45C6.94 2.45 7.79 2.77 8.45 3.41L10.2 1.66C9.16 0.69 7.73 0.1 6 0.1C3.51 0.1 1.35 1.51 0.32 3.46L2.42 5.09C2.92 3.58 4.33 2.45 6 2.45Z" fill="#EA4335"/>
