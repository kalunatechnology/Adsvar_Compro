      <text x="10" y="13" fill="#E35F21" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700">Ad · adsvar.id</text>
      <text x="10" y="25" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Growth Marketing &amp; High-Converting Ads</text>
