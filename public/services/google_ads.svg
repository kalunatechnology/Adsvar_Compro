      <text x="182" y="13" fill="#66A3FF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700">HIGH INTENT</text>
    </g>

    <line x1="14" y1="46" x2="250" y2="46" stroke="#ffffff" stroke-opacity="0.06" />

