      <text x="24" y="9" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Google Ads</text>
      <text x="24" y="20" fill="#8B8B97" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Search · Performance Max · YouTube</text>

