<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 170" width="304" height="170" fill="none">
  <defs>
    <linearGradient id="bgMeta" x1="0" y1="0" x2="304" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F0F16" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="metaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0081FB" />
      <stop offset="50%" stop-color="#0064E0" />
      <stop offset="100%" stop-color="#E35F21" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#12121A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="304" height="170" fill="url(#bgMeta)" />
  <rect x="0.5" y="0.5" width="303" height="169" stroke="#ffffff" stroke-opacity="0.06" rx="6" />

  <!-- Ambient Glow -->
  <circle cx="240" cy="40" r="70" fill="#E35F21" fill-opacity="0.12" filter="blur(30px)" />
  <circle cx="60" cy="130" r="60" fill="#0081FB" fill-opacity="0.1" filter="blur(25px)" />

  <!-- Meta Floating UI Card -->
  <g transform="translate(20, 20)">
    <!-- Main Card Body -->
    <rect width="264" height="130" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" />

    <!-- Card Header -->
    <g transform="translate(14, 14)">
      <!-- Meta Infinity Logo -->
      <path d="M12.5 4.5C10.5 1.7 7.2 0.5 4.5 2C1.5 3.6 0.3 7 1.8 10C3.3 12.8 6.8 13.8 9.8 12.2C11.5 11.3 12.6 9.8 13.5 8.2C14.4 9.8 15.5 11.3 17.2 12.2C20.2 13.8 23.7 12.8 25.2 10C26.7 7 25.5 3.6 22.5 2C19.8 0.5 16.5 1.7 14.5 4.5L13.5 6L12.5 4.5Z" fill="url(#metaGrad)" />
      
      <text x="34" y="9" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">Meta Ads</text>
      <text x="34" y="20" fill="#8B8B97" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Facebook &amp; Instagram Campaign</text>

      <!-- Badge "Sponsored" -->
      <rect x="180" y="2" width="56" height="16" rx="4" fill="#E35F21" fill-opacity="0.15" stroke="#E35F21" stroke-opacity="0.4" />
      <text x="190" y="13" fill="#E35F21" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700">SPONSORED</text>
    </g>

    <!-- Divider -->
    <line x1="14" y1="46" x2="250" y2="46" stroke="#ffffff" stroke-opacity="0.06" />

    <!-- Performance Metric Blocks -->
    <g transform="translate(14, 56)">
      <!-- Metric 1: Retargeting Funnel -->
      <rect width="72" height="40" rx="6" fill="#0D0D14" stroke="#ffffff" stroke-opacity="0.05" />
      <text x="8" y="14" fill="#8B8B97" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600">AUDIENCE</text>
      <text x="8" y="28" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Lookalike</text>
      <text x="8" y="36" fill="#0081FB" font-family="system-ui, -apple-system, sans-serif" font-size="7">+ Retargeting</text>

      <!-- Metric 2: Destination -->
      <g transform="translate(78, 0)">
        <rect width="76" height="40" rx="6" fill="#0D0D14" stroke="#ffffff" stroke-opacity="0.05" />
        <text x="8" y="14" fill="#8B8B97" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600">CONVERSION</text>
        <text x="8" y="28" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">WhatsApp</text>
        <text x="8" y="36" fill="#25D366" font-family="system-ui, -apple-system, sans-serif" font-size="7">Direct Checkout</text>
      </g>

      <!-- Metric 3: Target ROAS -->
      <g transform="translate(160, 0)">
        <rect width="76" height="40" rx="6" fill="#0D0D14" stroke="#ffffff" stroke-opacity="0.05" />
        <text x="8" y="14" fill="#8B8B97" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600">AVG ROAS</text>
        <text x="8" y="28" fill="#E35F21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">4.5x</text>
        <text x="8" y="36" fill="#8B8B97" font-family="system-ui, -apple-system, sans-serif" font-size="7">Break-even beat</text>
      </g>
    </g>

    <!-- Bottom Action Pill -->
    <g transform="translate(14, 104)">
      <rect width="236" height="16" rx="4" fill="#ffffff" fill-opacity="0.04" />
      <circle cx="10" cy="8" r="3" fill="#25D366" />
      <text x="18" y="11" fill="#A1A1B2" font-family="system-ui, -apple-system, sans-serif" font-size="8">Lead direct to WhatsApp / CPAS Marketplace Catalog</text>
    </g>
  </g>
</svg>
